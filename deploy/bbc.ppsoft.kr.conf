# nginx: bbc.ppsoft.kr → 예배팀 주간 도구 v2 (127.0.0.1:8830)
#
# 최초 1회 설치 (서버에서, sudo 비밀번호 필요):
#
#   1) 설정 넣기 (mv 가 아니라 cp — SELinux 라벨 때문)
#      sudo cp ~/worship-tools/deploy/bbc.ppsoft.kr.conf /etc/nginx/conf.d/bbc.ppsoft.kr.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#   2) HTTPS 발급 (certbot 이 아래 server 블록에 443 설정과 http→https 이동을 덧붙인다)
#      sudo certbot --nginx -d bbc.ppsoft.kr

server {
    server_name bbc.ppsoft.kr;

    # 사이트 자체가 로그인으로 보호된다(Google 로그인 + 허용 이메일).

    # 예전 기록 가져오기(JSON) 파일을 올릴 수 있게 여유를 둔다
    # 악보 업로드. .env의 MAX_SHEET_MB는 이 값보다 작아야 한다
    # (크면 nginx가 먼저 413을 내서 앱의 안내 문구가 안 나온다).
    # 살아 있는 설정을 바꿀 때는 이 파일을 덮어쓰지 말고 그 줄만 고친다 —
    # certbot이 /etc/nginx/conf.d/bbc.ppsoft.kr.conf 에 SSL 설정을 넣어 두었다.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8830;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 쇼츠 기획은 서버 작업 + 폴링이라 요청 하나가 오래 걸리지 않는다
        proxy_read_timeout 60s;
    }

    listen 80;
}
