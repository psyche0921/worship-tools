<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setlist 재생목록</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc;
  --accent:#d6362f; --accent-text:#ffffff; --ok:#1f8a4c; --warn:#b26a00; --err:#c0392b;
  --input:#fbfaf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1e1e21; --text:#f2f2f3; --muted:#9a9aa1; --line:#313136;
    --accent:#ff4d44; --accent-text:#ffffff; --ok:#4cc27d; --warn:#f0a43a; --err:#ff6b5e;
    --input:#18181b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:4px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
textarea,input,select{width:100%;font:inherit;color:var(--text);background:var(--input);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:180px;resize:vertical;font-size:.9rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;
  background:var(--accent);color:var(--accent-text);font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row > *{flex:1 1 auto}
details summary{cursor:pointer;font-weight:600}
details .hint{font-size:.85rem;color:var(--muted);margin:8px 0}
.block-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.block-head input{font-weight:700}
.song{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.song:first-of-type{border-top:0}
.song img{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.song .meta{min-width:0;flex:1}
.song .name{font-weight:600;word-break:keep-all}
.song .notes{font-size:.8rem;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.song .st{font-size:.8rem;margin-top:2px}
.st.ok{color:var(--ok)} .st.err{color:var(--err)} .st.run{color:var(--warn)}
.result{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--ok)}
.rtitle{font-weight:700;color:var(--ok);margin-bottom:8px}
.result .link{font-size:.85rem}
.msg{font-size:.85rem;margin-top:8px}
.msg.err{color:var(--err)}
.empty{color:var(--muted);font-size:.9rem;text-align:center;padding:10px}
.count{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--muted);font-weight:600;padding:9px}
.tabs button.active{background:var(--accent);color:var(--accent-text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-top:12px}
textarea.small{min-height:70px}
textarea.skill{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.md{font-size:.92rem;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:.2em 0 .5em;line-height:1.35}
.md h1{font-size:1.15rem}.md h2{font-size:1.08rem}.md h3,.md h4{font-size:1rem}
.md p{margin:.5em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.3em}
.md pre{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.82rem}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:.85em}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tbl{overflow-x:auto;margin:.5em 0}
.md table{border-collapse:collapse;font-size:.84rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--input)}
a.ts{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.card-tools{display:flex;justify-content:flex-end;margin-top:8px}
.card-tools button{padding:7px 12px;font-size:.85rem}
.note{font-size:.8rem;color:var(--warn);margin:0 0 10px}
</style>
</head>
<body>
<main>
  <h1>예배팀 주간 도구</h1>
  <p class="sub" id="subtitle">단톡방 메시지를 붙여넣으면 곡을 찾아 재생목록을 만들어요.</p>

  <nav class="tabs">
    <button data-tab="setlist" class="active">세트리스트</button>
    <button data-tab="shorts">쇼츠 기획</button>
  </nav>

  <details class="card" id="settings">
    <summary>설정</summary>
    <p class="hint">Google Cloud에서 만든 OAuth 클라이언트 ID를 한 번만 입력하면 이 브라우저에 저장됩니다.</p>
    <label for="clientId">OAuth 클라이언트 ID</label>
    <input id="clientId" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <p class="hint">재생목록은 항상 '일부 공개'(링크가 있는 사람만 볼 수 있음)로 만들어집니다.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <label for="geminiKey">Gemini API 키 (쇼츠 기획용)</label>
    <input id="geminiKey" type="password" placeholder="AIza..." autocomplete="off">
    <div class="two field">
      <div><label for="gModel">모델</label><input id="gModel" autocomplete="off"></div>
      <div><label for="skillPath">스킬 파일 경로</label><input id="skillPath" placeholder="SKILL.md" autocomplete="off"></div>
    </div>
    <div class="field">
      <label for="skillText">스킬 내용 직접 붙여넣기 (비우면 위 경로의 파일 사용)</label>
      <textarea id="skillText" class="skill" placeholder="---&#10;name: ...&#10;---&#10;..."></textarea>
    </div>
    <div class="row"><button id="saveSettings" class="ghost">저장</button></div>
  </details>

  <section id="tab-setlist">

  <div class="card">
    <label for="input">카톡 메시지</label>
    <textarea id="input" placeholder="Setlist 261018&#10;&#10;곡 제목&#10;https://youtu.be/...&#10;(KEY - A | TIME - 4/4 | TEMPO - 106)"></textarea>
    <div class="row">
      <button id="pasteBtn" class="ghost">붙여넣기</button>
      <button id="parseBtn">곡 찾기</button>
    </div>
  </div>

  <div id="blocks"></div>
  </section>

  <section id="tab-shorts" hidden>
    <div class="card">
      <label for="liveUrl">라이브 영상 링크</label>
      <input id="liveUrl" placeholder="https://www.youtube.com/live/..." autocomplete="off" inputmode="url">
      <div class="two field">
        <div><label for="tStart">설교 시작</label><input id="tStart" placeholder="1:02:30" inputmode="numeric"></div>
        <div><label for="tEnd">설교 끝</label><input id="tEnd" placeholder="1:45:10" inputmode="numeric"></div>
      </div>
      <div class="row"><button id="detectBtn" class="ghost">설교 구간 자동 찾기</button></div>
      <div class="field">
        <label for="extra">추가 요청 (선택)</label>
        <textarea id="extra" class="small" placeholder="예: 이번 주는 3편만, 청년부 대상으로"></textarea>
      </div>
      <div class="row"><button id="planBtn">쇼츠 기획</button></div>
      <div class="msg" id="shortsMsg"></div>
    </div>
    <div id="shortsOut"></div>
  </section>
</main>

<script id="parser">
/* ---------- 메시지 파싱 (브라우저/Node 공용) ---------- */
const URL_RE = /https?:\/\/[^\s<>()]+/gi;

function extractVideoId(url){
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^(www|m|music)\./,'');
    let id = null;
    if(host === 'youtu.be') id = u.pathname.split('/')[1];
    else if(host === 'youtube.com' || host.endsWith('.youtube.com')){
      id = u.searchParams.get('v');
      if(!id){
        const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([\w-]{11})/);
        if(m) id = m[2];
      }
    }
    if(id && /^[\w-]{11}$/.test(id.slice(0,11))) return id.slice(0,11);
  }catch(e){}
  return null;
}

function nextSundayYYMMDD(now){
  const d = new Date(now || Date.now());
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  const p = n => String(n).padStart(2,'0');
  return p(d.getFullYear()%100) + p(d.getMonth()+1) + p(d.getDate());
}

function parseMessage(text, now){
  const blocks = String(text).split(/^\s*[-=_─━]{5,}\s*$/m);
  const result = [];
  for(const raw of blocks){
    const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
    let date = null, titleIdx = -1;
    lines.forEach((l,i) => {
      if(titleIdx === -1 && /set\s*-?\s*list/i.test(l) && !URL_RE.test(l)){
        titleIdx = i;
        const m = l.match(/(\d{6})/);
        if(m) date = m[1];
      }
      URL_RE.lastIndex = 0;
    });

    // 링크가 있는 줄 찾기
    const urlLines = [];
    lines.forEach((l,i) => {
      const urls = l.match(URL_RE) || [];
      const ids = urls.map(extractVideoId).filter(Boolean);
      if(ids.length) urlLines.push({i, ids, rest: l.replace(URL_RE,'').trim()});
    });
    if(!urlLines.length) continue;

    const isUrlLine = i => urlLines.some(u => u.i === i);
    const songs = [];
    urlLines.forEach((u, k) => {
      const prevUrlIdx = k ? urlLines[k-1].i : -1;
      let name = u.rest, nameIdx = -1;
      if(!name){
        const c = u.i - 1;
        if(c > prevUrlIdx && c !== titleIdx && !isUrlLine(c)){ name = lines[c]; nameIdx = c; }
      }
      // 메모: 다음 곡 제목 줄 직전까지
      let end = lines.length;
      if(k + 1 < urlLines.length){
        const n = urlLines[k+1];
        end = n.rest ? n.i : n.i - 1;
        if(end <= u.i) end = n.i;
      }
      const notes = lines.slice(u.i + 1, end).filter((_,j) => (u.i+1+j) !== titleIdx);
      u.ids.forEach((id, j) => songs.push({
        id, name: name || '', notes: j === 0 ? notes : [], nameIdx
      }));
    });

    result.push({
      title: 'Setlist ' + (date || nextSundayYYMMDD(now)),
      dateFromMessage: !!date,
      songs
    });
  }
  return result;
}

function buildDescription(block){
  const out = [];
  block.songs.forEach((s, i) => {
    out.push(`${i+1}. ${s.name || '(제목 없음)'}`);
    s.notes.forEach(n => out.push('   ' + n));
  });
  return out.join('\n').replace(/[<>]/g,'').slice(0, 4900);
}

if(typeof module !== 'undefined') module.exports = {parseMessage, extractVideoId, nextSundayYYMMDD, buildDescription};
</script>

<script>
/* ---------- 저장소 (실패해도 동작) ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

const $ = s => document.querySelector(s);
const clientIdEl = $('#clientId');
const PRIVACY = 'unlisted'; // 링크가 있는 사람만 접근
clientIdEl.value = store.get('clientId') || '';
if(!clientIdEl.value) $('#settings').open = true;

$('#saveSettings').onclick = () => {
  store.set('clientId', clientIdEl.value.trim());
  tokenClient = null; accessToken = null;
  $('#settings').open = false;
};

$('#pasteBtn').onclick = async () => {
  try{ $('#input').value = await navigator.clipboard.readText(); render(); }
  catch(e){ $('#input').focus(); }
};
$('#parseBtn').onclick = render;

/* ---------- 미리보기 ---------- */
let parsed = [];
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  parsed = parseMessage($('#input').value);
  const wrap = $('#blocks');
  if(!parsed.length){
    wrap.innerHTML = '<div class="card empty">유튜브 링크를 찾지 못했어요.</div>';
    return;
  }
  wrap.innerHTML = parsed.map((b, bi) => `
    <div class="card" data-b="${bi}">
      <div class="block-head">
        <input class="title" value="${esc(b.title)}" aria-label="재생목록 제목">
        <span class="count">${b.songs.length}곡</span>
      </div>
      ${b.songs.map((s, si) => `
        <div class="song">
          <img src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" alt="" loading="lazy">
          <div class="meta">
            <div class="name">${esc(s.name || '(제목 없음)')}</div>
            ${s.notes.length ? `<div class="notes">${esc(s.notes.join('\n'))}</div>` : ''}
            <div class="st" id="st-${bi}-${si}"></div>
          </div>
        </div>`).join('')}
      <div class="row">
        <button class="create">재생목록 만들기</button>
        <a class="btn ghost" target="_blank" rel="noopener"
           href="https://www.youtube.com/watch_videos?video_ids=${b.songs.map(s=>s.id).join(',')}">로그인 없이 재생</a>
      </div>
      <div class="msg"></div>
      <div class="out"></div>
    </div>`).join('');
  wrap.querySelectorAll('.create').forEach(btn => {
    btn.onclick = () => createPlaylist(+btn.closest('[data-b]').dataset.b, btn);
  });
}

/* ---------- Google 로그인 ---------- */
let tokenClient = null, accessToken = null, tokenExp = 0;

function getToken(){
  return new Promise((resolve, reject) => {
    if(accessToken && Date.now() < tokenExp - 60000) return resolve(accessToken);
    const cid = clientIdEl.value.trim();
    if(!cid){ $('#settings').open = true; return reject(new Error('설정에서 OAuth 클라이언트 ID를 먼저 입력하세요.')); }
    if(!window.google || !google.accounts || !google.accounts.oauth2)
      return reject(new Error('Google 로그인 스크립트를 불러오지 못했어요. 잠시 후 다시 시도하세요.'));
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: 'https://www.googleapis.com/auth/youtube',
        callback: () => {}
      });
    }
    tokenClient.callback = resp => {
      if(resp.error) return reject(new Error('로그인 실패: ' + resp.error));
      accessToken = resp.access_token;
      tokenExp = Date.now() + (resp.expires_in || 3600) * 1000;
      resolve(accessToken);
    };
    tokenClient.error_callback = err => reject(new Error('로그인 창이 닫혔거나 차단됐어요. (' + (err.type || 'error') + ')'));
    tokenClient.requestAccessToken({prompt: ''});
  });
}

async function yt(path, body){
  const res = await fetch('https://www.googleapis.com/youtube/v3/' + path, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const e = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    e.status = res.status;
    e.reason = data.error && data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
    throw e;
  }
  return data;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 재생목록 생성 ---------- */
async function createPlaylist(bi, btn){
  const card = btn.closest('[data-b]');
  const msg = card.querySelector('.msg'), out = card.querySelector('.out');
  const block = parsed[bi];
  const title = card.querySelector('.title').value.trim() || block.title;
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true;

  try{
    await getToken();
    msg.textContent = '재생목록 만드는 중…';
    const pl = await yt('playlists?part=snippet,status', {
      snippet: {title, description: buildDescription(block)},
      status: {privacyStatus: PRIVACY}
    });

    let ok = 0;
    for(let si = 0; si < block.songs.length; si++){
      const st = document.getElementById(`st-${bi}-${si}`);
      st.className = 'st run'; st.textContent = '추가 중…';
      let tries = 0;
      while(true){
        try{
          await yt('playlistItems?part=snippet', {
            snippet: {playlistId: pl.id, resourceId: {kind: 'youtube#video', videoId: block.songs[si].id}}
          });
          st.className = 'st ok'; st.textContent = '추가됨'; ok++;
          break;
        }catch(e){
          if((e.status === 409 || e.status >= 500) && tries++ < 2){ await sleep(1200); continue; }
          st.className = 'st err';
          st.textContent = e.reason === 'videoNotFound' ? '영상을 찾을 수 없음 (삭제/비공개)' : '실패: ' + e.message;
          break;
        }
      }
      await sleep(250);
    }

    const url = 'https://www.youtube.com/playlist?list=' + pl.id;
    msg.textContent = `${block.songs.length}곡 중 ${ok}곡 추가 완료`;
    out.innerHTML = `<div class="result">
        <div class="rtitle">${esc(title)} · 일부 공개</div>
        <input class="link" value="${url}" readonly>
        <div class="row">
          <button class="copy">링크 복사</button>
          <button class="ghost share">카톡 등으로 공유</button>
        </div>
        <div class="row"><a class="btn ghost" href="${url}" target="_blank" rel="noopener">유튜브에서 열기</a></div>
      </div>`;
    out.querySelector('.copy').onclick = async e => {
      const b = e.currentTarget;
      try{ await navigator.clipboard.writeText(url); }
      catch(_){ const f = out.querySelector('.link'); f.select(); try{ document.execCommand('copy'); }catch(__){ prompt('링크를 복사하세요', url); return; } }
      b.textContent = '복사됨 ✓'; setTimeout(() => b.textContent = '링크 복사', 2000);
    };
    out.querySelector('.share').onclick = async () => {
      if(navigator.share){ try{ await navigator.share({title, url}); }catch(_){} }
      else { try{ await navigator.clipboard.writeText(url); }catch(_){ prompt('링크를 복사하세요', url); } }
    };
  }catch(e){
    msg.className = 'msg err';
    msg.textContent = e.message;
    if(e.status === 401){ accessToken = null; }
    if(e.status === 403 && /quota/i.test(e.message)) msg.textContent = '오늘 API 할당량을 다 썼어요. 내일 다시 시도하세요.';
  }finally{
    btn.disabled = false;
  }
}

/* ================= 탭 ================= */
const SUBS = {
  setlist: '단톡방 메시지를 붙여넣으면 곡을 찾아 재생목록을 만들어요.',
  shorts: '라이브 영상의 설교 구간으로 스킬 지침에 따라 쇼츠를 기획해요.'
};
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $('#tab-setlist').hidden = t !== 'setlist';
  $('#tab-shorts').hidden = t !== 'shorts';
  $('#subtitle').textContent = SUBS[t];
  store.set('tab', t);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
showTab(store.get('tab') === 'shorts' ? 'shorts' : 'setlist');

/* ================= 쇼츠 설정 ================= */
const DEFAULT_MODEL = 'gemini-3.8-flash';
const geminiKeyEl = $('#geminiKey'), modelEl = $('#gModel'), skillPathEl = $('#skillPath'), skillTextEl = $('#skillText');
geminiKeyEl.value = store.get('geminiKey') || '';
modelEl.value = store.get('gModel') || DEFAULT_MODEL;
skillPathEl.value = store.get('skillPath') || 'SKILL.md';
skillTextEl.value = store.get('skillText') || '';
$('#saveSettings').addEventListener('click', () => {
  store.set('geminiKey', geminiKeyEl.value.trim());
  store.set('gModel', modelEl.value.trim() || DEFAULT_MODEL);
  store.set('skillPath', skillPathEl.value.trim() || 'SKILL.md');
  store.set('skillText', skillTextEl.value);
});

/* ================= 시간 유틸 ================= */
function parseTime(s){
  s = String(s || '').trim().replace(/[^\d:]/g, '');
  if(!s) return null;
  const p = s.split(':').map(Number);
  if(p.some(isNaN) || p.length > 3) return NaN;
  return p.reduce((a, b) => a * 60 + b, 0);
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
}

/* ================= Gemini 호출 ================= */
async function loadSkill(){
  let text = skillTextEl.value.trim();
  if(!text){
    const path = skillPathEl.value.trim() || 'SKILL.md';
    let r = null;
    try{ r = await fetch(path, {cache: 'no-store'}); }catch(e){}
    if(!r || !r.ok) throw new Error(`스킬 파일(${path})을 불러오지 못했어요. 저장소에 올렸는지 확인하거나 설정에 내용을 붙여넣으세요.`);
    text = await r.text();
  }
  return text.replace(/^﻿?---\r?\n[\s\S]*?\r?\n---\r?\n/, '').trim();
}

function videoPart(id, start, end){
  const part = {file_data: {file_uri: 'https://www.youtube.com/watch?v=' + id}};
  if(start != null || end != null){
    part.video_metadata = {};
    if(start != null) part.video_metadata.start_offset = start + 's';
    if(end != null) part.video_metadata.end_offset = end + 's';
  }
  return part;
}

async function gemini(body){
  const key = geminiKeyEl.value.trim();
  if(!key){ $('#settings').open = true; throw new Error('설정에서 Gemini API 키를 먼저 입력하세요.'); }
  const model = modelEl.value.trim() || DEFAULT_MODEL;
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const m = (data.error && data.error.message) || ('HTTP ' + res.status);
    if(res.status === 429) throw new Error('요청 한도를 넘었어요. 잠시 후 다시 시도하세요. (' + m + ')');
    throw new Error(m);
  }
  const c = data.candidates && data.candidates[0];
  const text = c && c.content && c.content.parts
    ? c.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join('') : '';
  if(!text){
    const why = (data.promptFeedback && data.promptFeedback.blockReason) || (c && c.finishReason) || '알 수 없음';
    throw new Error('응답이 비어 있어요. (' + why + ')');
  }
  return text;
}

function withTimer(msgEl, label){
  const t0 = Date.now();
  msgEl.className = 'msg';
  const tick = () => msgEl.textContent = `${label} ${Math.floor((Date.now() - t0) / 1000)}초`;
  tick();
  const h = setInterval(tick, 1000);
  return () => clearInterval(h);
}

function readVideo(){
  const id = extractVideoId($('#liveUrl').value.trim());
  if(!id) throw new Error('유튜브 영상 링크를 확인하세요.');
  return id;
}

/* ---------- 설교 구간 자동 찾기 ---------- */
$('#detectBtn').onclick = async () => {
  const btn = $('#detectBtn'), msg = $('#shortsMsg');
  let stop = () => {};
  btn.disabled = true;
  try{
    const id = readVideo();
    stop = withTimer(msg, '설교 구간 찾는 중…');
    const text = await gemini({
      contents: [{role: 'user', parts: [videoPart(id), {text:
        '이 영상은 교회 주일 예배 라이브입니다. 설교(말씀 선포)가 시작되는 시각과 끝나는 시각을 찾아주세요. ' +
        '설교 전 성경 봉독은 포함하고, 설교 후 기도·찬양·광고는 제외합니다. ' +
        'JSON으로만 답하세요: {"start":"h:mm:ss","end":"h:mm:ss","title":"설교 제목(알 수 있으면)"}'}]}],
      generationConfig: {responseMimeType: 'application/json', mediaResolution: 'MEDIA_RESOLUTION_LOW'}
    });
    const j = JSON.parse(text.replace(/^```(?:json)?|```$/g, '').trim());
    const s = parseTime(j.start), e = parseTime(j.end);
    if(!(s >= 0) || !(e > s)) throw new Error('설교 구간을 찾지 못했어요. 직접 입력해 주세요.');
    $('#tStart').value = fmtTime(s);
    $('#tEnd').value = fmtTime(e);
    stop();
    msg.className = 'msg';
    msg.textContent = `설교 구간: ${fmtTime(s)} ~ ${fmtTime(e)}` + (j.title ? ` · ${j.title}` : '') + ' (확인 후 필요하면 고치세요)';
  }catch(e){
    stop(); msg.className = 'msg err'; msg.textContent = e.message;
  }finally{ btn.disabled = false; }
};

/* ---------- 쇼츠 기획 ---------- */
$('#planBtn').onclick = async () => {
  const btn = $('#planBtn'), msg = $('#shortsMsg');
  let stop = () => {};
  btn.disabled = true;
  try{
    const id = readVideo();
    const s = parseTime($('#tStart').value), e = parseTime($('#tEnd').value);
    if(Number.isNaN(s) || Number.isNaN(e)) throw new Error('시각은 1:02:30 또는 62:30 형식으로 입력하세요.');
    if(s != null && e != null && e <= s) throw new Error('설교 끝 시각이 시작보다 늦어야 해요.');
    const skill = await loadSkill();
    const range = (s != null || e != null)
      ? `첨부 영상은 주일 예배 라이브 영상에서 설교 구간(원본 기준 ${s != null ? fmtTime(s) : '처음'} ~ ${e != null ? fmtTime(e) : '끝'})만 잘라낸 것입니다.`
      : '첨부 영상은 주일 예배 라이브 영상입니다.';
    const prompt = [
      range,
      '스킬 지침에 따라 이 설교로 쇼츠를 기획해 주세요.',
      '모든 타임스탬프는 원본 라이브 영상 기준 절대 시각(h:mm:ss)으로 적어 주세요.' +
        (s ? ` 잘라낸 영상의 0:00은 원본의 ${fmtTime(s)}입니다.` : ''),
      $('#extra').value.trim() ? '추가 요청: ' + $('#extra').value.trim() : ''
    ].filter(Boolean).join('\n');

    stop = withTimer(msg, '쇼츠 기획 중… (1~2분 걸릴 수 있어요)');
    const text = await gemini({
      system_instruction: {parts: [{text: skill}]},
      contents: [{role: 'user', parts: [videoPart(id, s, e), {text: prompt}]}],
      generationConfig: {mediaResolution: 'MEDIA_RESOLUTION_LOW'}
    });
    stop();
    const last = {id, start: s || 0, text, at: Date.now()};
    store.set('shortsLast', JSON.stringify(last));
    renderShorts(last);
    msg.className = 'msg'; msg.textContent = '완료';
  }catch(e){
    stop(); msg.className = 'msg err'; msg.textContent = e.message;
  }finally{ btn.disabled = false; }
};

/* ================= 결과 표시 ================= */
const TS_RE = /(?<![\d:])(\d{1,2}:)?(\d{1,2}):(\d{2})(?![\d:])/g;

function inlineMd(t){
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}

function renderMd(src){
  const lines = src.replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [], i = 0;
  const flushP = () => { if(para.length){ html += '<p>' + inlineMd(para.join('<br>')) + '</p>'; para = []; } };
  const closeL = () => { if(list){ html += `</${list}>`; list = null; } };
  while(i < lines.length){
    const raw = lines[i], l = esc(raw);
    if(/^\s*```/.test(raw)){
      flushP(); closeL();
      const buf = []; i++;
      while(i < lines.length && !/^\s*```/.test(lines[i])) buf.push(esc(lines[i++]));
      html += '<pre><code>' + buf.join('\n') + '</code></pre>'; i++; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(raw) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flushP(); closeL();
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inlineMd(esc(c.trim())));
      html += '<div class="tbl"><table><thead><tr>' + cells(raw).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        html += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>'; i++;
      }
      html += '</tbody></table></div>'; continue;
    }
    let m;
    if((m = l.match(/^\s*(#{1,6})\s+(.*)$/))){ flushP(); closeL(); const n = Math.min(m[1].length, 4); html += `<h${n}>${inlineMd(m[2])}</h${n}>`; }
    else if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(raw)){ flushP(); closeL(); html += '<hr>'; }
    else if((m = l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if(list !== 'ul'){ closeL(); html += '<ul>'; list = 'ul'; } html += `<li>${inlineMd(m[1])}</li>`; }
    else if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list !== 'ol'){ closeL(); html += '<ol>'; list = 'ol'; } html += `<li>${inlineMd(m[1])}</li>`; }
    else if(!raw.trim()){ flushP(); closeL(); }
    else { closeL(); para.push(l); }
    i++;
  }
  flushP(); closeL();
  return html;
}

function toSec(m){ return (m[1] ? parseInt(m[1]) * 3600 : 0) + parseInt(m[2]) * 60 + parseInt(m[3]); }

function linkTimes(html, id, offset){
  // 태그 밖 텍스트에만 적용
  return html.replace(/(<[^>]+>)|([^<]+)/g, (all, tag, txt) => tag ? tag :
    txt.replace(TS_RE, (...m) => {
      const sec = toSec(m) + offset;
      return `<a class="ts" href="https://youtu.be/${id}?t=${sec}" target="_blank" rel="noopener">${fmtTime(sec)}</a>`;
    }));
}

function splitSections(src){
  const lines = src.replace(/\r/g, '').split('\n');
  let level = 0;
  for(const lv of [1, 2, 3]){
    const re = new RegExp('^\\s*#{' + lv + '}\\s+');
    if(lines.filter(l => re.test(l)).length >= 2){ level = lv; break; }
  }
  if(!level) return [src];
  const re = new RegExp('^\\s*#{' + level + '}\\s+');
  const out = []; let cur = [];
  lines.forEach(l => { if(re.test(l) && cur.join('').trim()){ out.push(cur.join('\n')); cur = []; } cur.push(l); });
  if(cur.join('').trim()) out.push(cur.join('\n'));
  return out;
}

function plain(md){
  return md.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/^\s*#{1,6}\s+/gm, '').replace(/`([^`]+)`/g, '$1').trim();
}

async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(_){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(__){} ta.remove();
  }
  const o = btn.textContent; btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = o, 1500);
}

function renderShorts(last){
  const out = $('#shortsOut');
  if(!last || !last.text){ out.innerHTML = ''; return; }
  // 모델이 잘라낸 구간 기준 시각으로 답했는지 확인: 모든 시각이 시작보다 작으면 보정
  const all = [...last.text.matchAll(TS_RE)].map(toSec);
  const offset = last.start > 0 && all.length && Math.max(...all) < last.start ? last.start : 0;
  const sections = splitSections(last.text);
  const when = new Date(last.at).toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
  out.innerHTML =
    `<div class="row" style="margin:0 0 14px">
       <button class="ghost" id="copyAll">전체 복사</button>
       <a class="btn ghost" href="https://youtu.be/${last.id}" target="_blank" rel="noopener">영상 열기</a>
     </div>
     <p class="hint" style="color:var(--muted);font-size:.8rem;margin:-6px 0 12px">${when} 생성</p>` +
    (offset ? `<p class="note">답변의 시각이 설교 구간 기준으로 보여서 원본 영상 시각으로 보정했어요.</p>` : '') +
    sections.map((sec, i) => `
      <div class="card">
        <div class="md">${linkTimes(renderMd(sec), last.id, offset)}</div>
        <div class="card-tools"><button class="ghost" data-i="${i}">복사</button></div>
      </div>`).join('');
  out.querySelector('#copyAll').onclick = e => copyText(plain(last.text), e.currentTarget);
  out.querySelectorAll('.card-tools button').forEach(b => b.onclick = () => copyText(plain(sections[+b.dataset.i]), b));
}

try{ renderShorts(JSON.parse(store.get('shortsLast') || 'null')); }catch(e){}
</script>
