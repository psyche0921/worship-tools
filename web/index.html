<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예배팀 주간 도구</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc;
  --accent:#d6362f; --accent-text:#ffffff; --ok:#1f8a4c; --warn:#b26a00; --err:#c0392b;
  --input:#fbfaf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1e1e21; --text:#f2f2f3; --muted:#9a9aa1; --line:#313136;
    --accent:#ff4d44; --accent-text:#ffffff; --ok:#4cc27d; --warn:#f0a43a; --err:#ff6b5e;
    --input:#18181b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:4px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
textarea,input,select{width:100%;font:inherit;color:var(--text);background:var(--input);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:180px;resize:vertical;font-size:.9rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;
  background:var(--accent);color:var(--accent-text);font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row > *{flex:1 1 auto}
.block-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.block-head input{font-weight:700}
.song{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.song:first-of-type{border-top:0}
.song img{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.song .meta{min-width:0;flex:1}
.song .name{font-weight:600;word-break:keep-all}
.song .notes{font-size:.8rem;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.song .st{font-size:.8rem;margin-top:2px}
.st.ok{color:var(--ok)} .st.err{color:var(--err)} .st.run{color:var(--warn)}
.result{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--ok)}
.rtitle{font-weight:700;color:var(--ok);margin-bottom:8px}
.result .link{font-size:.85rem}
.msg{font-size:.85rem;margin-top:8px}
.msg.err{color:var(--err)}
.empty{color:var(--muted);font-size:.9rem;text-align:center;padding:10px}
.count{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--muted);font-weight:600;padding:9px 6px;white-space:nowrap}
.tabs button.active{background:var(--accent);color:var(--accent-text)}
@media (max-width:430px){ .tabs{gap:2px} .tabs button{font-size:.82rem;padding:9px 2px} }
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-top:12px}
textarea.small{min-height:70px}
textarea.skill{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.md{font-size:.92rem;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:.2em 0 .5em;line-height:1.35}
.md h1{font-size:1.15rem}.md h2{font-size:1.08rem}.md h3,.md h4{font-size:1rem}
.md p{margin:.5em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.3em}
.md pre{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.82rem}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:.85em}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tbl{overflow-x:auto;margin:.5em 0}
.md table{border-collapse:collapse;font-size:.84rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--input)}
a.ts{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.card-tools{display:flex;justify-content:flex-end;margin-top:8px}
.card-tools button{padding:7px 12px;font-size:.85rem}
.note{font-size:.8rem;color:var(--warn);margin:0 0 10px}
.list{margin:.4em 0}
.li{display:flex;gap:.45em;margin:.25em 0;padding-left:calc(var(--ind) * 1.2em)}
.li .mk{flex:none;min-width:.9em;color:var(--muted)}
.li > div{min-width:0}
a.lnk{color:var(--accent);text-decoration:none;word-break:break-all}
.view-head .vh-title,.vh-title{font-weight:700;font-size:1.05rem;word-break:keep-all}
.vh-meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.hrow{display:flex;gap:8px;align-items:stretch;border-top:1px solid var(--line);padding:8px 0}
.hrow:first-child{border-top:0}
.hrow .hopen{flex:1;min-width:0;background:transparent;color:var(--text);padding:6px 8px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-weight:600;border-radius:8px}
.hrow.active .hopen{background:var(--input);box-shadow:inset 3px 0 0 var(--accent)}
.hrow .ht{word-break:keep-all}
.hrow .hm{font-size:.78rem;font-weight:400;color:var(--muted)}
[hidden]{display:none!important}
button.confirm{background:var(--err)!important;color:#fff!important;border-color:var(--err)!important}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-8px 0 14px;font-size:.85rem;color:var(--muted)}
.userbar button{padding:6px 12px;font-size:.82rem}
.login{text-align:center;padding:28px 16px}
.login p{color:var(--muted);font-size:.9rem;margin:6px 0 18px}
#gsiBtn{display:flex;justify-content:center;min-height:44px}
.badge{font-size:.72rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted);margin-left:6px}
.mrow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.mrow:first-child{border-top:0}
.mrow .mi{flex:1;min-width:0}
.mrow .me{font-weight:600;word-break:break-all}
.mrow .mm{font-size:.78rem;color:var(--muted)}
.mrow button{flex:none;padding:6px 12px;font-size:.82rem}
.warn{color:var(--warn);font-size:.85rem;margin:0 0 8px}
.rec-hint{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.md.script{font-size:.88rem;color:var(--text)}
.md.script p{margin:.45em 0}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{flex:1}
.rec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.pager button{flex:none;padding:7px 14px;font-size:.85rem}
.kind{font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:6px;white-space:nowrap;
  border:1px solid var(--line);background:var(--input);color:var(--muted)}
.kind.k-shorts{color:var(--accent);border-color:var(--accent)}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.9rem;
  margin-top:12px;padding:6px 10px;background:var(--input);border:1px solid var(--line);border-radius:8px}
.wk:first-child .wk-h{margin-top:0}
</style>

<body>

      </div>

</main>

<script id="parser">
/* ---------- 메시지 파싱 (브라우저/Node 공용) ---------- */
const URL_RE = /https?:\/\/[^\s<>()]+/gi;

function extractVideoId(url){
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^(www|m|music)\./,'');
    let id = null;
    if(host === 'youtu.be') id = u.pathname.split('/')[1];
    else if(host === 'youtube.com' || host.endsWith('.youtube.com')){
      id = u.searchParams.get('v');
      if(!id){
        const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([\w-]{11})/);
        if(m) id = m[2];
      }
    }
    if(id && /^[\w-]{11}$/.test(id.slice(0,11))) return id.slice(0,11);
  }catch(e){}
  return null;
}

function nextSundayYYMMDD(now){
  const d = new Date(now || Date.now());
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  const p = n => String(n).padStart(2,'0');
  return p(d.getFullYear()%100) + p(d.getMonth()+1) + p(d.getDate());
}

function parseMessage(text, now){
  const blocks = String(text).split(/^\s*[-=_─━]{5,}\s*$/m);
  const result = [];
  for(const raw of blocks){
    const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
    let date = null, titleIdx = -1;
    lines.forEach((l,i) => {
      if(titleIdx === -1 && /set\s*-?\s*list/i.test(l) && !URL_RE.test(l)){
        titleIdx = i;
        const m = l.match(/(\d{6})/);
        if(m) date = m[1];
      }
      URL_RE.lastIndex = 0;
    });

    // 링크가 있는 줄 찾기
    const urlLines = [];
    lines.forEach((l,i) => {
      const urls = l.match(URL_RE) || [];
      const ids = urls.map(extractVideoId).filter(Boolean);
      if(ids.length) urlLines.push({i, ids, rest: l.replace(URL_RE,'').trim()});
    });
    if(!urlLines.length) continue;

    const isUrlLine = i => urlLines.some(u => u.i === i);
    const songs = [];
    urlLines.forEach((u, k) => {
      const prevUrlIdx = k ? urlLines[k-1].i : -1;
      let name = u.rest, nameIdx = -1;
      if(!name){
        const c = u.i - 1;
        if(c > prevUrlIdx && c !== titleIdx && !isUrlLine(c)){ name = lines[c]; nameIdx = c; }
      }
      // 메모: 다음 곡 제목 줄 직전까지
      let end = lines.length;
      if(k + 1 < urlLines.length){
        const n = urlLines[k+1];
        end = n.rest ? n.i : n.i - 1;
        if(end <= u.i) end = n.i;
      }
      const notes = lines.slice(u.i + 1, end).filter((_,j) => (u.i+1+j) !== titleIdx);
      u.ids.forEach((id, j) => songs.push({
        id, name: name || '', notes: j === 0 ? notes : [], nameIdx
      }));
    });

    result.push({
      title: 'Setlist ' + (date || nextSundayYYMMDD(now)),
      dateFromMessage: !!date,
      songs
    });
  }
  return result;
}

function buildDescription(block){
  const out = [];
  block.songs.forEach((s, i) => {
    out.push(`${i+1}. ${s.name || '(제목 없음)'}`);
    s.notes.forEach(n => out.push('   ' + n));
  });
  return out.join('\n').replace(/[<>]/g,'').slice(0, 4900);
}

if(typeof module !== 'undefined') module.exports = {parseMessage, extractVideoId, nextSundayYYMMDD, buildDescription};
</script>

<script>
/* ---------- 저장소 (실패해도 동작) ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

const $ = s => document.querySelector(s);
const PRIVACY = 'unlisted'; // 링크가 있는 사람만 접근

/* ---------- 서버 API ---------- */
let CONFIG = {clientId: ''}, ME = null;

async function api(path, opts = {}){
  const init = {method: opts.method || 'GET', headers: {}, credentials: 'same-origin'};
  if(opts.body !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  let res;
  try{ res = await fetch(path, init); }
  catch(e){ const err = new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인하세요.'); err.network = true; throw err; }
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const err = new Error(typeof data.detail === 'string' ? data.detail
      : res.status === 422 ? '입력값을 확인하세요.' : '요청에 실패했어요. (HTTP ' + res.status + ')');
    err.status = res.status;
    if(res.status === 401 && ME && !path.startsWith('/api/auth/')) showLogin('로그인이 만료됐어요. 다시 로그인해 주세요.');
    throw err;
  }
  return data;
}

/* ---------- 사이트 로그인 (Google ID 토큰 → 서버 세션) ---------- */
function waitForGoogle(){
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function check(){
      if(window.google && google.accounts && google.accounts.id) return resolve();
      if(Date.now() - t0 > 15000) return reject(new Error('Google 로그인 스크립트를 불러오지 못했어요. 새로고침해 주세요.'));
      setTimeout(check, 100);
    })();
  });
}

let gsiReady = false;
async function showLogin(message){
  ME = null;
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#subtitle').textContent = '예배팀 로그인 후 사용할 수 있어요.';
  $('#loginMsg').textContent = message || '';
  if(!CONFIG.clientId){ $('#loginMsg').textContent = '서버에 OAuth 클라이언트 ID가 설정되지 않았어요.'; return; }
  try{ await waitForGoogle(); }catch(e){ $('#loginMsg').textContent = e.message; return; }
  if(!gsiReady){
    google.accounts.id.initialize({client_id: CONFIG.clientId, callback: onCredential, ux_mode: 'popup'});
    gsiReady = true;
  }
  $('#gsiBtn').innerHTML = '';
  google.accounts.id.renderButton($('#gsiBtn'), {theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko'});
}

async function onCredential(resp){
  $('#loginMsg').textContent = '';
  try{
    ME = await api('/api/auth/google', {method: 'POST', body: {credential: resp.credential}});
    startApp();
  }catch(e){ $('#loginMsg').textContent = e.message; }
}

$('#logoutBtn').onclick = async () => {
  try{ await api('/api/auth/logout', {method: 'POST'}); }catch(_){}
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  accessToken = null;
  showLogin();
};

$('#pasteBtn').onclick = async () => {
  try{ $('#input').value = await navigator.clipboard.readText(); render(); }
  catch(e){ $('#input').focus(); }
};
$('#parseBtn').onclick = render;

/* ---------- 미리보기 ---------- */
let parsed = [];
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  parsed = parseMessage($('#input').value);
  const wrap = $('#blocks');
  if(!parsed.length){
    wrap.innerHTML = '<div class="card empty">유튜브 링크를 찾지 못했어요.</div>';
    return;
  }
  wrap.innerHTML = parsed.map((b, bi) => `
    <div class="card" data-b="${bi}">
      <div class="block-head">

/* ---------- Google 로그인 ---------- */
let tokenClient = null, accessToken = null, tokenExp = 0;

function getToken(){
  return new Promise((resolve, reject) => {
    if(accessToken && Date.now() < tokenExp - 60000) return resolve(accessToken);
    const cid = CONFIG.clientId;
    if(!cid) return reject(new Error('서버에 OAuth 클라이언트 ID가 설정되지 않았어요.'));
    if(!window.google || !google.accounts || !google.accounts.oauth2)
      return reject(new Error('Google 로그인 스크립트를 불러오지 못했어요. 잠시 후 다시 시도하세요.'));
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: 'https://www.googleapis.com/auth/youtube',
        callback: () => {}
      });
    }
    tokenClient.callback = resp => {
      if(resp.error) return reject(new Error('로그인 실패: ' + resp.error));
      accessToken = resp.access_token;
      tokenExp = Date.now() + (resp.expires_in || 3600) * 1000;
      resolve(accessToken);
    };
    tokenClient.error_callback = err => reject(new Error('로그인 창이 닫혔거나 차단됐어요. (' + (err.type || 'error') + ')'));
    tokenClient.requestAccessToken({prompt: ''});
  });
}

async function yt(path, body){
  const res = await fetch('https://www.googleapis.com/youtube/v3/' + path, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const e = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    e.status = res.status;
    e.reason = data.error && data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
    throw e;
  }
  return data;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 재생목록 생성 ---------- */
async function createPlaylist(bi, btn){
  const card = btn.closest('[data-b]');
  const msg = card.querySelector('.msg'), out = card.querySelector('.out');
  const block = parsed[bi];
  const title = card.querySelector('.title').value.trim() || block.title;
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true;

  try{
    await getToken();
    msg.textContent = '재생목록 만드는 중…';
    const pl = await yt('playlists?part=snippet,status', {
      snippet: {title, description: buildDescription(block)},
      status: {privacyStatus: PRIVACY}
    });

    let ok = 0;
    for(let si = 0; si < block.songs.length; si++){
      const st = document.getElementById(`st-${bi}-${si}`);
      st.className = 'st run'; st.textContent = '추가 중…';
      let tries = 0;
      while(true){
        try{
          await yt('playlistItems?part=snippet', {
            snippet: {playlistId: pl.id, resourceId: {kind: 'youtube#video', videoId: block.songs[si].id}}
          });
          st.className = 'st ok'; st.textContent = '추가됨'; ok++;
          break;
        }catch(e){
          if((e.status === 409 || e.status >= 500) && tries++ < 2){ await sleep(1200); continue; }
          st.className = 'st err';
          st.textContent = e.reason === 'videoNotFound' ? '영상을 찾을 수 없음 (삭제/비공개)' : '실패: ' + e.message;
          break;
        }
      }
      await sleep(250);
    }

    const url = 'https://www.youtube.com/playlist?list=' + pl.id;
    msg.textContent = `${block.songs.length}곡 중 ${ok}곡 추가 완료 · 작업 기록에 저장됨`;
    out.innerHTML = playlistResultHtml(title, url);
    bindPlaylistResult(out, title, url);
    try{
      await api('/api/setlists', {method: 'POST', body: {
        playlistId: pl.id, title, url, ok, total: block.songs.length,
        songs: block.songs.map(({id, name, notes}) => ({id, name, notes})),
        rawMessage: $('#input').value
      }});
      records.invalidate();
    }catch(e){ throw new Error('재생목록은 만들었지만 작업 기록 저장에 실패했어요: ' + e.message); }
  }catch(e){
    msg.className = 'msg err';
    msg.textContent = e.message;
    if(e.status === 401){ accessToken = null; }
    if(e.status === 403 && /quota/i.test(e.message)) msg.textContent = '오늘 API 할당량을 다 썼어요. 내일 다시 시도하세요.';
  }finally{
    btn.disabled = false;
  }
}

/* ================= 시간 유틸 ================= */
function parseTime(s){
  s = String(s || '').trim().replace(/[^\d:]/g, '');
  if(!s) return null;
  const p = s.split(':').map(Number);
  if(p.some(isNaN) || p.length > 3) return NaN;
  return p.reduce((a, b) => a * 60 + b, 0);
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
}

/* ================= 서버 작업 (Gemini는 서버가 호출) ================= */
const JOB_DEADLINE = 15 * 60 * 1000;

async function pollJob(id){
  const t0 = Date.now();
  while(Date.now() - t0 < JOB_DEADLINE){
    await sleep(2500);
    let j;
    try{ j = await api('/api/jobs/' + encodeURIComponent(id)); }
    catch(e){ if(e.network) continue; throw e; }  // 잠깐 연결이 끊긴 건 다시 확인
    if(j.status === 'done') return j;
    if(j.status === 'error') throw new Error(j.error || '작업에 실패했어요.');
  }
  throw new Error('작업이 너무 오래 걸려요. 잠시 뒤 작업 기록을 확인해 주세요.');
}

// 진행 중인 쇼츠 기획은 새로고침해도 이어서 확인한다.

  const {jobId} = await api('/api/jobs', {method: 'POST', body});

}

/* ================= 결과 표시 ================= */
const TS_RE = /(?<![\d:])(\d{1,2}:)?(\d{1,2}):(\d{2})(?![\d:])/g;
const TS_ONE = new RegExp(TS_RE.source);

function toSec(m){ return (m[1] ? parseInt(m[1]) * 3600 : 0) + parseInt(m[2]) * 60 + parseInt(m[3]); }

function hmsToSec(t){
  t = String(t || '').trim();
  if(/^\d+$/.test(t)) return +t;
  if(/^\d+(:\d+){1,2}$/.test(t)) return parseTime(t);
  const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s)?$/i);
  if(!m || !(m[1] || m[2] || m[3])) return null;
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + Math.floor(+m[3] || 0);
}

// (#t=0h38m54s) 같은 앵커 표기 제거
function cleanText(src){
  return String(src || '')
    .replace(/\[([^\]]*)\]\(\s*#t=([^)\s]*)\s*\)/gi, (all, label, t) => {
      if(TS_ONE.test(label)) return label;
      const sec = hmsToSec(t);
      return sec != null ? (label.trim() ? label.trim() + ' ' : '') + fmtTime(sec) : label;
    })
    .replace(/[ \t]*[(\[]\s*#t=[^)\]\s]*\s*[)\]]/gi, '')
    .replace(/[ \t]*#t=\d+h?\d*m?\d*(?:\.\d+)?s?\b/gi, '');
}

/* ---------- 인라인 → 조각(run) ---------- */
function pushTimes(runs, s, fmt, ctx){
  let last = 0;
  for(const m of s.matchAll(TS_RE)){
    if(m.index > last) runs.push({...fmt, t: s.slice(last, m.index)});
    const sec = toSec(m) + ctx.offset;
    runs.push({...fmt, t: fmtTime(sec), href: `https://youtu.be/${ctx.id}?t=${sec}`, ts: 1});
    last = m.index + m[0].length;
  }
  if(last < s.length) runs.push({...fmt, t: s.slice(last)});
}

function parseInline(text, ctx){
  const runs = [];
  const re = /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>()]+)|(?<![*\w])\*(?![\s*])([^*]+?)\*(?![\w*])/g;
  let last = 0, m;
  while((m = re.exec(text))){
    if(m.index > last) pushTimes(runs, text.slice(last, m.index), {}, ctx);
    if(m[1] != null) parseInline(m[1], ctx).forEach(r => runs.push({...r, b: 1}));
    else if(m[2] != null) runs.push({t: m[2], code: 1});
    else if(m[3] != null) runs.push({t: m[3], href: m[4]});
    else if(m[5] != null) runs.push({t: m[5], href: m[5]});
    else if(m[6] != null) parseInline(m[6], ctx).forEach(r => runs.push({...r, i: 1}));
    last = re.lastIndex;
  }
  if(last < text.length) pushTimes(runs, text.slice(last), {}, ctx);
  return runs;
}

function linesToRuns(lines, ctx){
  const runs = [];
  lines.forEach((l, i) => { if(i) runs.push({br: 1}); runs.push(...parseInline(l, ctx)); });
  return runs;
}

/* ---------- 마크다운 → 블록 ---------- */
function parseBlocks(src, ctx){
  const lines = src.replace(/\r/g, '').split('\n');
  const blocks = [];
  let i = 0, para = null, list = null;
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => parseInline(c.trim(), ctx));
  while(i < lines.length){
    const raw = lines[i];
    if(/^\s*```/.test(raw)){
      para = list = null;
      const buf = []; i++;
      while(i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      blocks.push({type: 'code', lines: buf}); i++; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(raw) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      para = list = null;
      const t = {type: 'table', head: cells(raw), rows: []};
      i += 2;
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) t.rows.push(cells(lines[i++]));
      blocks.push(t); continue;
    }
    let m;
    const indent = Math.min(2, Math.floor((raw.match(/^\s*/)[0].replace(/\t/g, '  ').length) / 2));
    if((m = raw.match(/^\s*(#{1,6})\s+(.*)$/))){
      para = list = null;
      blocks.push({type: 'h', level: Math.min(m[1].length, 4), runs: parseInline(m[2].replace(/\s*#+\s*$/, ''), ctx)});
    }else if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(raw)){
      para = list = null; blocks.push({type: 'hr'});
    }else if((m = raw.match(/^\s*([-*•+])\s+(.*)$/)) || (m = raw.match(/^\s*(\d+[.)])\s+(.*)$/))){
      para = null;
      if(!list){ list = {type: 'list', items: []}; blocks.push(list); }
      list.items.push({mark: /\d/.test(m[1]) ? m[1].replace(')', '.') : '•', indent, runs: parseInline(m[2], ctx)});
    }else if(!raw.trim()){
      para = list = null;
    }else if(list && indent > 0){
      // 목록 항목 이어지는 줄
      const it = list.items[list.items.length - 1];
      it.runs.push({br: 1}, ...parseInline(raw.trim(), ctx));
    }else{
      list = null;
      if(!para){ para = {type: 'p', lines: []}; blocks.push(para); }
      para.lines.push(raw.trim());
    }
    i++;
  }
  blocks.forEach(b => { if(b.type === 'p') b.runs = linesToRuns(b.lines, ctx); });
  return blocks;
}

/* ---------- 블록 → HTML ---------- */
function runsHtml(runs){
  return runs.map(r => {
    if(r.br) return '<br>';
    let h = esc(r.t);
    if(r.code) h = `<code>${h}</code>`;
    if(r.i) h = `<em>${h}</em>`;
    if(r.b) h = `<strong>${h}</strong>`;
    if(r.href) h = `<a class="${r.ts ? 'ts' : 'lnk'}" href="${esc(r.href)}" target="_blank" rel="noopener">${h}</a>`;
    return h;
  }).join('');
}

function blocksHtml(blocks){
  return blocks.map(b => {
    switch(b.type){
      case 'h': return `<h${b.level}>${runsHtml(b.runs)}</h${b.level}>`;
      case 'p': return `<p>${runsHtml(b.runs)}</p>`;
      case 'hr': return '<hr>';
      case 'code': return `<pre><code>${esc(b.lines.join('\n'))}</code></pre>`;
      case 'list': return '<div class="list">' + b.items.map(it =>
        `<div class="li" style="--ind:${it.indent}"><span class="mk">${esc(it.mark)}</span><div>${runsHtml(it.runs)}</div></div>`).join('') + '</div>';
      case 'table': return '<div class="tbl"><table><thead><tr>' + b.head.map(c => `<th>${runsHtml(c)}</th>`).join('') +
        '</tr></thead><tbody>' + b.rows.map(r => '<tr>' + r.map(c => `<td>${runsHtml(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    return '';
  }).join('');
}

function splitSections(src){
  const lines = src.replace(/\r/g, '').split('\n');
  let level = 0;
  for(const lv of [1, 2, 3]){
    const re = new RegExp('^\\s*#{' + lv + '}\\s+');
    if(lines.filter(l => re.test(l)).length >= 2){ level = lv; break; }
  }
  if(!level) return [src];
  const re = new RegExp('^\\s*#{' + level + '}\\s+');
  const out = []; let cur = [];
  lines.forEach(l => { if(re.test(l) && cur.join('').trim()){ out.push(cur.join('\n')); cur = []; } cur.push(l); });
  if(cur.join('').trim()) out.push(cur.join('\n'));
  return out;
}

function plain(md){
  return cleanText(md).replace(/\*\*([^*]+)\*\*/g, '$1').replace(/^\s*#{1,6}\s+/gm, '').replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '$1 ($2)').trim();
}

async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(_){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(__){} ta.remove();
  }
  const o = btn.textContent; btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = o, 1500);
}

function fmtWhen(ts){
  return new Date(ts).toLocaleString('ko-KR', {year: '2-digit', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
}

function yymmdd(d){
  const p = n => String(n).padStart(2, '0');
  return p(d.getFullYear() % 100) + p(d.getMonth() + 1) + p(d.getDate());
}
function sundayOf(ts){ const d = new Date(ts); d.setDate(d.getDate() - d.getDay()); return d; }

// 결과 텍스트 → 섹션별 블록 (화면/PDF 공용)
function prepareShorts(item){
  const text = cleanText(item.text);
  const all = [...text.matchAll(TS_RE)].map(toSec);
  // 모델이 잘라낸 구간 기준 시각으로 답했으면(모든 시각 < 시작) 원본 시각으로 보정
  const offset = item.start > 0 && all.length && Math.max(...all) < item.start ? item.start : 0;
  const ctx = {id: item.id, offset};
  const sections = splitSections(text).map(md => ({md, blocks: parseBlocks(md, ctx)}));
  return {text, offset, sections};
}

function shortsRange(item){
  if(!item.start && !item.end) return '';
  return `${item.start ? fmtTime(item.start) : '처음'} ~ ${item.end ? fmtTime(item.end) : '끝'}`;
}

let currentShorts = null;

// 쇼츠 기획 탭과 작업 기록 탭이 같은 화면을 쓴다. opts.close/opts.del은 작업 기록에서만 쓴다.
function shortsViewInto(box, item, opts = {}){
  const p = prepareShorts(item);
  const range = shortsRange(item);
  box.innerHTML =
    `<div class="card view-head">
       <div class="block-head">
         <div class="vh-title" style="flex:1">${esc(item.title || '쇼츠 기획')}</div>
         ${opts.close ? '<button class="ghost close" style="padding:6px 12px;flex:none">닫기</button>' : ''}
       </div>
       <div class="vh-meta">${fmtWhen(item.at)} 생성${range ? ' · 설교 ' + esc(range) : ''}${item.byName ? ' · ' + esc(item.byName) : ''}</div>
       <div class="row">
         <button class="pdfShare">PDF 공유</button>
         <button class="ghost pdfSave">PDF 저장</button>
       </div>
       <div class="row">
         <button class="ghost copyAll">전체 복사</button>
         <button class="ghost scriptBtn">설교 대본 보기</button>
       </div>
       <div class="row">
         <a class="btn ghost" href="https://youtu.be/${item.id}${item.start ? '?t=' + item.start : ''}" target="_blank" rel="noopener">영상 열기</a>
         ${opts.del ? '<button class="ghost del" data-label="기록 삭제">기록 삭제</button>' : ''}
       </div>
       <div class="msg pdfMsg"></div>
     </div>
     <div class="scriptBox"></div>` +
    (p.offset ? `<p class="note">답변의 시각이 설교 구간 기준으로 보여서 원본 영상 시각으로 보정했어요.</p>` : '') +
    p.sections.map((s, i) => `
      <div class="card">
        <div class="md">${blocksHtml(s.blocks)}</div>
        <div class="card-tools"><button class="ghost" data-i="${i}">복사</button></div>
      </div>`).join('');
  box.querySelector('.copyAll').onclick = e => copyText(plain(item.text), e.currentTarget);
  box.querySelectorAll('.card-tools button').forEach(b => b.onclick = () => copyText(plain(p.sections[+b.dataset.i].md), b));
  box.querySelector('.pdfShare').onclick = e => pdfAction(item, e.currentTarget, 'share');
  box.querySelector('.pdfSave').onclick = e => pdfAction(item, e.currentTarget, 'save');
  bindScript(box, item);
  if(opts.close) box.querySelector('.close').onclick = opts.close;
  bindDelete(box, opts.del);
  preloadPdf();
}

/* ---------- 설교 대본 ----------
   기획할 때 서버가 이어서 받아쓴다. 아직 없거나 실패했으면 여기서 다시 만든다. */
function scriptHtml(item){
  const st = item.transcriptStatus || '';
  if(item.transcript){
    const text = cleanText(item.transcript);
    const all = [...text.matchAll(TS_RE)].map(toSec);
    const offset = item.start > 0 && all.length && Math.max(...all) < item.start ? item.start : 0;
    return `<div class="card">
        <div class="block-head"><div class="vh-title" style="flex:1">설교 대본</div>
          <button class="ghost scriptCopy" style="padding:6px 12px;flex:none">복사</button></div>
        <div class="md script">${blocksHtml(parseBlocks(text, {id: item.id, offset}))}</div>
      </div>`;
  }
  if(st === 'running'){
    return '<div class="card empty">설교 대본을 만드는 중이에요. 1~2분쯤 걸려요.</div>';
  }
  return `<div class="card">
      <div class="empty">${esc(item.transcriptError || '아직 설교 대본이 없어요.')}</div>
      <div class="row"><button class="ghost scriptMake">설교 대본 만들기</button></div>
    </div>`;
}

function bindScript(box, item){
  const btn = box.querySelector('.scriptBtn'), wrap = box.querySelector('.scriptBox');
  let open = false, timer = 0;

  const draw = () => {
    wrap.innerHTML = open ? scriptHtml(item) : '';
    btn.textContent = open ? '설교 대본 닫기' : '설교 대본 보기';
    if(!open){ clearTimeout(timer); return; }
    const copy = wrap.querySelector('.scriptCopy');
    if(copy) copy.onclick = e => copyText(plain(item.transcript), e.currentTarget);
    const make = wrap.querySelector('.scriptMake');
    if(make) make.onclick = async () => {
      make.disabled = true;
      try{
        await api(`/api/shorts/${encodeURIComponent(item.key)}/transcript`, {method: 'POST'});
        item.transcriptStatus = 'running'; item.transcriptError = null;
        draw();
      }catch(e){ make.disabled = false; item.transcriptError = e.message; draw(); }
    };
    if(item.transcriptStatus === 'running') timer = setTimeout(poll, 5000);
  };

  const poll = async () => {
    try{
      const full = await api('/api/shorts/' + encodeURIComponent(item.key));
      Object.assign(item, full);
    }catch(e){ if(!e.network){ item.transcriptStatus = 'error'; item.transcriptError = e.message; } }
    if(open) draw();
  };

  btn.onclick = () => { open = !open; draw(); if(open && !item.transcript) poll(); };
}

function renderShorts(item){
  const out = $('#shortsOut');
  currentShorts = item && item.text ? item : null;
  if(!currentShorts){ out.innerHTML = ''; return; }
  shortsViewInto(out, item);
}

/* ================= PDF ================= */
let pdfAssets = null;
function loadPdfAssets(){
  if(!pdfAssets){
    pdfAssets = (async () => {
      if(!window.jspdf){
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'vendor/jspdf.umd.min.js';
          s.onload = res; s.onerror = () => rej(new Error('PDF 라이브러리를 불러오지 못했어요.'));
          document.head.appendChild(s);
        });
      }
      const fonts = {};
      for(const w of ['Regular', 'Bold']){
        const r = await fetch(`fonts/NanumGothic-${w}.ttf`);
        if(!r.ok) throw new Error('PDF용 글꼴을 불러오지 못했어요.');
        fonts[w] = abToB64(await r.arrayBuffer());
      }
      return fonts;
    })();
    pdfAssets.catch(() => { pdfAssets = null; });
  }
  return pdfAssets;
}
function preloadPdf(){
  const c = navigator.connection;
  if(c && c.saveData) return;
  setTimeout(() => loadPdfAssets().catch(() => {}), 1200);
}
function abToB64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}

async function buildPdf(item){
  const fonts = await loadPdfAssets();
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'pt', format: 'a4', compress: true});
  doc.addFileToVFS('NG-R.ttf', fonts.Regular); doc.addFont('NG-R.ttf', 'NG', 'normal');
  doc.addFileToVFS('NG-B.ttf', fonts.Bold); doc.addFont('NG-B.ttf', 'NG', 'bold');
  const title = item.title || '쇼츠 기획';
  doc.setProperties({title, creator: '예배팀 주간 도구'});

  const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();
  const M = 46, W = PW - 2 * M, BOTTOM = PH - 52;
  const C = {text: [29, 29, 31], muted: [110, 110, 116], link: [196, 40, 34], line: [222, 220, 214], fill: [245, 244, 240]};
  let y = M;

  const newPage = () => { doc.addPage(); y = M; };
  const ensure = h => { if(y + h > BOTTOM && y > M) newPage(); };
  const font = (r, size) => { doc.setFont('NG', r && r.b ? 'bold' : 'normal'); doc.setFontSize(size); };

  // 조각들을 폭에 맞춰 줄로 나누기
  function layout(runs, width, size, base){
    const lines = []; let line = [], lw = 0;
    const flush = () => {
      while(line.length && !line[line.length - 1].t.trim()){ lw -= line.pop().w; }
      const l = line[line.length - 1];
      if(l && /\s$/.test(l.t)){ const t = l.t.replace(/\s+$/, ''); font(l.r, size); l.w = doc.getTextWidth(t); l.t = t; }
      lines.push(line); line = []; lw = 0;
    };
    for(const r0 of runs){
      if(r0.br){ flush(); continue; }
      const r = base ? {...base, ...r0} : r0;
      font(r, size);
      const add = t => {
        const w = doc.getTextWidth(t), last = line[line.length - 1];
        if(last && last.r === r){ last.t += t; last.w += w; } else line.push({r, t, w});
        lw += w;
      };
      for(let tok of String(r.t).split(/(\s+)/)){
        if(!tok) continue;
        if(/^\s+$/.test(tok)){ if(line.length) add(' '); continue; }
        let w = doc.getTextWidth(tok);
        if(lw + w > width && line.length) flush();
        if(w > width){
          let buf = '';
          for(const ch of tok){
            if(lw + doc.getTextWidth(buf + ch) > width && (buf || line.length)){
              if(buf) add(buf);
              flush(); buf = ch;
            }else buf += ch;
          }
          tok = buf;
        }
        if(tok) add(tok);
      }
    }
    if(line.length || !lines.length) flush();
    return lines;
  }

  function drawLine(ln, x, ty, size, lh, color){
    let cx = x;
    for(const s of ln){
      font(s.r, size);
      const col = s.r.href ? C.link : (color || C.text);
      doc.setTextColor(...col);
      const top = ty + (lh - size) / 2;
      doc.text(s.t, cx, top, {baseline: 'top'});
      if(s.r.href && s.t.trim()){
        doc.link(cx, ty, s.w, lh, {url: s.r.href});
        doc.setDrawColor(...C.link); doc.setLineWidth(0.5);
        doc.line(cx, top + size + 1.2, cx + s.w, top + size + 1.2);
      }
      cx += s.w;
    }
  }

  function para(runs, x, width, size, lh, opts = {}){
    const lines = layout(runs, width, size, opts.base);
    lines.forEach((ln, i) => {
      ensure(lh);
      if(i === 0 && opts.marker){
        font(null, size); doc.setTextColor(...C.muted);
        doc.text(opts.marker, x - opts.markerW, y + (lh - size) / 2, {baseline: 'top'});
      }
      drawLine(ln, x, y, size, lh, opts.color);
      y += lh;
    });
  }

  function table(b){
    const size = 9.2, lh = 13.5, pad = 5;
    const ncol = Math.max(b.head.length, ...b.rows.map(r => r.length));
    const textOf = runs => runs.map(r => r.t || '').join('');
    const nat = Array(ncol).fill(0);
    [b.head, ...b.rows].forEach((row, ri) => row.forEach((c, ci) => {
      font({b: ri === 0}, size);
      nat[ci] = Math.max(nat[ci], doc.getTextWidth(textOf(c)) + 2 * pad);
    }));
    const weights = nat.map(n => Math.min(Math.max(n, 34), W * 0.55));
    const sum = weights.reduce((a, b) => a + b, 0);
    const widths = weights.map(w => sum <= W ? w + (W - sum) * (w / sum) : w * W / sum);
    const rowLayout = (row, bold) => {
      const cl = widths.map((w, ci) => layout(row[ci] || [], w - 2 * pad, size, bold ? {b: 1} : null));
      return {cl, h: Math.max(...cl.map(l => l.length)) * lh + 2 * pad};
    };
    const head = rowLayout(b.head, true);
    const drawRow = (rl, isHead) => {
      let x = M;
      widths.forEach((w, ci) => {
        if(isHead){ doc.setFillColor(...C.fill); doc.rect(x, y, w, rl.h, 'F'); }
        doc.setDrawColor(...C.line); doc.setLineWidth(0.6); doc.rect(x, y, w, rl.h, 'S');
        rl.cl[ci].forEach((ln, li) => drawLine(ln, x + pad, y + pad + li * lh, size, lh));
        x += w;
      });
      y += rl.h;
    };
    ensure(head.h + lh * 2 + 2 * pad);
    drawRow(head, true);
    b.rows.forEach(r => {
      const rl = rowLayout(r, false);
      if(y + rl.h > BOTTOM){ newPage(); drawRow(head, true); }
      drawRow(rl, false);
    });
    y += 8;
  }

  function blocks(list){
    list.forEach((b, bi) => {
      if(b.type === 'h'){
        const size = {1: 15, 2: 13.5, 3: 12, 4: 11}[b.level];
        if(y > M) y += bi ? 8 : 2;
        ensure(size * 1.5 + 34);
        para(b.runs, M, W, size, size * 1.45, {base: {b: 1}});
        y += 3;
      }else if(b.type === 'p'){
        para(b.runs, M, W, 10.4, 16); y += 5;
      }else if(b.type === 'list'){
        b.items.forEach(it => {
          const x0 = M + it.indent * 14;
          font(null, 10.4);
          const mw = Math.max(11, doc.getTextWidth(it.mark) + 5);
          para(it.runs, x0 + mw, W - (x0 - M) - mw, 10.4, 16, {marker: it.mark, markerW: mw});
          y += 1.5;
        });
        y += 4;
      }else if(b.type === 'table'){
        table(b);
      }else if(b.type === 'hr'){
        ensure(12); y += 4; doc.setDrawColor(...C.line); doc.setLineWidth(0.6); doc.line(M, y, M + W, y); y += 8;
      }else if(b.type === 'code'){
        const runs = linesToRuns(b.lines, {id: item.id, offset: 0}).map(r => r.br ? r : {t: r.t});
        const lines = layout(runs, W - 16, 9.2);
        lines.forEach(ln => {
          ensure(14);
          doc.setFillColor(...C.fill); doc.rect(M, y, W, 14, 'F');
          drawLine(ln, M + 8, y, 9.2, 14);
          y += 14;
        });
        y += 6;
      }
    });
  }

  // 머리말
  para([{t: title, b: 1}], M, W, 18, 25);
  y += 2;
  const range = shortsRange(item);
  para([{t: `${fmtWhen(item.at)} 생성` + (range ? ` · 설교 구간 ${range}` : '')}], M, W, 9.5, 14, {color: C.muted});
  const vurl = `https://youtu.be/${item.id}${item.start ? '?t=' + item.start : ''}`;
  para([{t: '영상: ', }, {t: vurl, href: vurl}], M, W, 9.5, 14, {color: C.muted});
  y += 6; doc.setDrawColor(...C.text); doc.setLineWidth(1); doc.line(M, y, M + W, y); y += 14;

  const p = prepareShorts(item);
  p.sections.forEach((s, si) => {
    if(si){
      ensure(40);
      y += 6; doc.setDrawColor(...C.line); doc.setLineWidth(0.8); doc.line(M, y, M + W, y); y += 14;
    }
    blocks(s.blocks);
  });

  // 쪽 번호
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){
    doc.setPage(i); font(null, 8); doc.setTextColor(...C.muted);
    doc.text(`${i} / ${n}`, PW / 2, PH - 28, {align: 'center', baseline: 'top'});
  }
  return doc.output('blob');
}

function pdfName(item){
  return `쇼츠기획_${yymmdd(sundayOf(item.at))}.pdf`;
}

const pdfCache = new Map();
async function pdfAction(item, btn, mode){
  const msg = btn.closest('.view-head').querySelector('.pdfMsg');
  msg.className = 'msg pdfMsg'; msg.textContent = '';
  let file = pdfCache.get(item.key);
  try{
    if(!file){
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'PDF 만드는 중…';
      try{
        const blob = await buildPdf(item);
        file = new File([blob], pdfName(item), {type: 'application/pdf'});
        pdfCache.set(item.key, file);
      }finally{ btn.disabled = false; btn.textContent = label; }
    }
    if(mode === 'share' && navigator.canShare && navigator.canShare({files: [file]})){
      try{
        await navigator.share({files: [file], title: file.name});
      }catch(e){
        if(e.name === 'NotAllowedError'){ msg.textContent = 'PDF가 준비됐어요. "PDF 공유"를 한 번 더 눌러주세요.'; }
        else if(e.name !== 'AbortError') throw e;
      }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    if(mode === 'share') msg.textContent = '이 브라우저는 파일 공유를 지원하지 않아서 PDF를 저장했어요.';
  }catch(e){
    msg.className = 'msg pdfMsg err'; msg.textContent = 'PDF 만들기 실패: ' + e.message;
  }
}

/* ================= 작업 기록 =================
   세트리스트와 쇼츠 기획 기록을 한곳에서 본다(팀원도 사용). 언제나 주일 예배 기준으로
   묶고 10주씩 보여 준다. 검색은 맞은 기록이 있는 주를 통째로 돌려주므로, 찬양 제목으로
   찾으면 그 주에 기획한 쇼츠도 함께 나온다. */
const PAGE_SIZE = 10;
const KIND_LABEL = {setlist: '세트리스트', shorts: '쇼츠 기획'};

const records = {
  q: '', kind: 'all', page: 1, pages: 1, loaded: false, open: null,
  async load(page){
    const box = $('#recList');
    const p = new URLSearchParams({kind: records.kind, page: Math.max(1, page || 1), size: PAGE_SIZE});
    if(records.q) p.set('q', records.q);
    box.innerHTML = '<div class="empty">불러오는 중…</div>';
    try{
      renderRecords(await api('/api/records?' + p));
      records.loaded = true;
    }catch(e){
      box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      $('#recPager').hidden = true;
      $('#recCount').textContent = '';
    }
  },
  // 기록이 늘거나 줄면 다시 불러온다(보고 있지 않으면 다음에 열 때).
  invalidate(){
    records.loaded = false;
    if(!$('#tab-records').hidden) records.load(records.page);
  }
};

function recordMeta(it){
  if(it.kind === 'setlist'){
    return `${it.dateLabel} 예배 · ${it.total}곡` + (it.ok < it.total ? ` (${it.ok}곡 추가됨)` : '')
      + (it.songs.length ? ' · ' + it.songs.join(', ') : '');
  }
  const r = shortsRange(it);
  return `${it.dateLabel} 예배` + (it.topic ? ' · ' + it.topic : '') + (r ? ' · 설교 ' + r : '')
    + (it.hasTranscript ? ' · 대본 있음' : '') + (it.byName ? ' · ' + it.byName : '');
}

function recordRow(it){
  return `<div class="hrow" data-kind="${it.kind}" data-key="${esc(it.key)}">
      <button class="hopen">
        <span class="ht"><span class="kind k-${it.kind}">${KIND_LABEL[it.kind]}</span>${esc(it.title || '(제목 없음)')}</span>
        <span class="hm">${esc(recordMeta(it))}</span>
      </button>
    </div>`;
}

function renderRecords(d){
  const box = $('#recList');
  records.page = d.page; records.pages = d.pages;
  $('#recCount').textContent = d.total
    ? `${d.weeks}주 · 세트리스트 ${d.counts.setlist} · 쇼츠 기획 ${d.counts.shorts}` : '';
  if(!d.total){
    box.innerHTML = `<div class="empty">${records.q ? '검색 결과가 없어요.' : '아직 기록이 없어요.'}</div>`;
  }else{
    box.innerHTML = d.groups.map(g => `
      <div class="wk">
        <div class="wk-h"><span>${esc(g.label)}</span><span class="count">${g.items.length}건</span></div>
        ${g.items.map(recordRow).join('')}
      </div>`).join('');
  }
  $('#recPager').hidden = d.pages < 2;
  $('#recPage').textContent = `${d.page} / ${d.pages}`;
  $('#recPrev').disabled = d.page <= 1;
  $('#recNext').disabled = d.page >= d.pages;
  box.querySelectorAll('.hrow').forEach(row => {
    row.querySelector('.hopen').onclick = () => openRecord(row.dataset.kind, row.dataset.key);
  });
  markRecord();
}

function markRecord(){
  const o = records.open;
  document.querySelectorAll('#recList .hrow').forEach(r =>
    r.classList.toggle('active', !!o && r.dataset.kind === o.kind && r.dataset.key === o.key));
}

async function openRecord(kind, key){
  const box = $('#recordView');
  box.innerHTML = '<div class="card empty">불러오는 중…</div>';
  box.scrollIntoView({behavior: 'smooth', block: 'start'});
  const opts = {close: closeRecord, del: null};
  try{
    // 쇼츠 상세는 쇼츠 기획 탭과 같은 API를 쓴다.
    const it = kind === 'shorts'
      ? await api('/api/shorts/' + encodeURIComponent(key))
      : await api('/api/records/setlist/' + encodeURIComponent(key));
    records.open = {kind, key};
    if(it.canDelete) opts.del = () => deleteRecord(kind, key);
    (kind === 'shorts' ? shortsViewInto : setlistViewInto)(box, it, opts);
  }catch(e){
    box.innerHTML = `<div class="card msg err">${esc(e.message)}</div>`;
    return;
  }
  markRecord();
}

function closeRecord(){
  records.open = null;
  $('#recordView').innerHTML = '';
  markRecord();
}

async function deleteRecord(kind, key){
  await api((kind === 'shorts' ? '/api/shorts/' : '/api/setlists/') + encodeURIComponent(key), {method: 'DELETE'});
  if(kind === 'shorts' && currentShorts && currentShorts.key === key) renderShorts(null);
  closeRecord();
  await records.load(records.page);
}

// 상세 화면의 '기록 삭제'(두 번 눌러 확인)
function bindDelete(box, fn){
  const btn = box.querySelector('.del');
  if(!btn || !fn) return;
  twoStep(btn, '정말 삭제할까요?', async () => {
    try{ await fn(); }
    catch(e){ const m = box.querySelector('.pdfMsg') || box.querySelector('.msg');
              if(m){ m.className = 'msg err'; m.textContent = e.message; } }
  });
}

$('#recSearch').onclick = () => { records.q = $('#recQ').value.trim(); records.load(1); };
$('#recQ').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); $('#recSearch').click(); } };
$('#recKind').onchange = e => { records.kind = e.currentTarget.value; records.load(1); };
$('#recPrev').onclick = () => records.load(records.page - 1);
$('#recNext').onclick = () => records.load(records.page + 1);

// 쇼츠 목록에는 원문이 없어서, 열 때 서버에서 받아 둔다.
async function shortsDetail(it){
  if(it.text) return it;
  const full = await api('/api/shorts/' + encodeURIComponent(it.key));
  Object.assign(it, full);
  return it;
}

/* ---------- 세트리스트 기록 보기 ---------- */
function setlistViewInto(box, it, opts = {}){
  box.innerHTML = `
    <div class="card view-head">
      <div class="block-head"><div class="vh-title" style="flex:1">${esc(it.title)}</div>
        ${opts.close ? '<button class="ghost close" style="padding:6px 12px;flex:none">닫기</button>' : ''}</div>
      <div class="vh-meta">${esc((it.dateLabel ? it.dateLabel + ' 예배 · ' : '') + fmtWhen(it.at) + ' 생성 · ' + it.total + '곡'
        + (it.ok < it.total ? ` (${it.ok}곡 추가됨)` : ''))}</div>
      ${playlistResultHtml(it.title, it.url)}
      ${opts.del ? '<div class="row"><button class="ghost del" data-label="기록 삭제">기록 삭제</button></div>' : ''}
      <div class="msg pdfMsg"></div>
      <div style="margin-top:12px">
      ${it.songs.map(s => `
        <div class="song">
          <img src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" alt="" loading="lazy">
          <div class="meta">
            <div class="name"><a class="lnk" href="https://youtu.be/${s.id}" target="_blank" rel="noopener">${esc(s.name || '(제목 없음)')}</a></div>
            ${s.notes && s.notes.length ? `<div class="notes">${esc(s.notes.join('\n'))}</div>` : ''}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  bindPlaylistResult(box, it.title, it.url);
  if(opts.close) box.querySelector('.close').onclick = opts.close;
  bindDelete(box, opts.del);
}

/* ================= 관리자 설정 ================= */
let adminLoaded = false;

function twoStep(btn, label, fn){
  btn.onclick = async () => {
    if(!btn.classList.contains('confirm')){
      btn.classList.add('confirm'); btn.textContent = label;
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = btn.dataset.label; }, 3000);
      return;
    }
    clearTimeout(btn._t);
    btn.disabled = true;
    try{ await fn(); }finally{ btn.disabled = false; }
  };
}

function fillSettings(st){
  $('#skillText').value = st.skill;
  $('#gModel').value = st.model;
  $('#gModel').placeholder = st.defaultModel;
  $('#keyWarn').hidden = st.geminiKeySet;
  $('#skillMeta').textContent = st.skillUpdatedAt
    ? `마지막 수정: ${fmtWhen(st.skillUpdatedAt)} · ${st.skillUpdatedBy}` : '아직 등록된 지침이 없어요.';
}

function renderMembers(list){
  const box = $('#memberList');
  box.innerHTML = list.map(m => `
    <div class="mrow" data-email="${esc(m.email)}">
      <div class="mi">
        <div class="me">${esc(m.name || m.email)}<span class="badge">${m.role === 'admin' ? '관리자' : '팀원'}</span></div>
        <div class="mm">${m.name ? esc(m.email) + ' · ' : ''}${m.lastLoginAt ? '최근 로그인 ' + fmtWhen(m.lastLoginAt) : '아직 로그인 안 함'}</div>
      </div>
      ${m.role === 'admin' ? '' : '<button class="ghost" data-label="삭제">삭제</button>'}
    </div>`).join('');
  box.querySelectorAll('.mrow button').forEach(b => {
    const email = b.closest('.mrow').dataset.email;
    twoStep(b, '삭제할까요?', async () => {
      try{ renderMembers(await api('/api/members/' + encodeURIComponent(email), {method: 'DELETE'})); }
      catch(e){ const m = $('#memberMsg'); m.className = 'msg err'; m.textContent = e.message; }
    });
  });
}

async function loadAdmin(){
  adminLoaded = true;
  const msg = $('#settingsMsg');
  try{
    const [st, members] = await Promise.all([api('/api/settings'), api('/api/members')]);
    fillSettings(st);
    renderMembers(members);
  }catch(e){ adminLoaded = false; msg.className = 'msg err'; msg.textContent = e.message; }
}

$('#saveSettings').onclick = async e => {
  const btn = e.currentTarget, msg = $('#settingsMsg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  try{
    fillSettings(await api('/api/settings', {method: 'PUT', body: {skill: $('#skillText').value, model: $('#gModel').value.trim()}}));
    msg.textContent = '저장했어요.';
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
  finally{ btn.disabled = false; }
};

$('#addMember').onclick = async e => {
  const btn = e.currentTarget, msg = $('#memberMsg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  try{
    renderMembers(await api('/api/members', {method: 'POST', body: {email: $('#mEmail').value.trim(), name: $('#mName').value.trim()}}));
    $('#mEmail').value = ''; $('#mName').value = '';
    msg.textContent = '추가했어요. 이 이메일의 Google 계정으로 로그인할 수 있어요.';
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
  finally{ btn.disabled = false; }
};

/* ================= 시작 ================= */
async function startApp(){
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#whoami').textContent = `${ME.name || ME.email} · ${isAdmin() ? '관리자' : '팀원'}`;
  const tabs = myTabs();
  $('#tabs').hidden = false;
  document.querySelectorAll('.tabs button').forEach(b => b.hidden = !tabs.includes(b.dataset.tab));
  showTab(store.get('tab') || tabs[0]);
  try{
    // 쇼츠 기획 탭에는 가장 최근 기획을 바로 펼쳐 둔다.
    const latest = (await api('/api/shorts?limit=1')).items[0];
    if(latest && !currentShorts) renderShorts(await shortsDetail(latest));
  }catch(e){ if(e.status !== 401){ const m = $('#shortsMsg'); m.className = 'msg err'; m.textContent = e.message; } }
  resumePlan();
}

(async function boot(){
  try{ CONFIG = await api('/api/config'); }
  catch(e){ $('#subtitle').textContent = e.message; return; }
  try{ ME = await api('/api/me'); }
  catch(e){ return showLogin(e.status === 401 ? '' : e.message); }
  startApp();
})();
</script>
